name: 🐛 Bug report
description: Something is broken or behaves unexpectedly
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The more detail you give, the faster it gets fixed.
        Logs, screenshots and video are all optional — share whatever is easy for you.

        **Before you file:** a few things are missing from the free version on purpose, not bugs —
        the command line runner for CI, JSON and CSV export, the source code, and Mac and Linux builds.
        See [Free vs Full](https://github.com/Fergius-Engineering/AssetStandardsValidatorFree#free-vs-full).

  - type: dropdown
    id: edition
    attributes:
      label: Which version are you using?
      options:
        - "Free"
        - "Full version"
    validations:
      required: true

  - type: dropdown
    id: ue-version
    attributes:
      label: Unreal Engine version
      options:
        - "5.0"
        - "5.1"
        - "5.2"
        - "5.3"
        - "5.4"
        - "5.5"
        - "5.6"
        - "5.7"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Open the plugin's `AssetStandardsValidator.uplugin` file and copy the `VersionName` value (e.g. 0.4.0). It also appears in the zip name.
      placeholder: "0.4.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong? Steps to reproduce if you can.
      placeholder: |
        1. Open ASV Panel
        2. Click Run Full Audit
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: 📄 Log file (optional)
      description: |
        First enable verbose logs:
        **Project Settings → Plugins → Asset Standards Validator → Output → Verbose Logging**.
        Reproduce the bug, then drag in your log file from
        `<YourProject>/Saved/Logs/<YourProject>.log`.
      placeholder: Drag the .log file here, or paste the relevant lines.
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 🖼️ Screenshot (optional)
      description: Drag an image into this box to attach it.
    validations:
      required: false

  - type: input
    id: video
    attributes:
      label: 🎬 Video link (optional)
      description: YouTube, Google Drive, Streamable — anything we can open.
      placeholder: https://...
    validations:
      required: false
